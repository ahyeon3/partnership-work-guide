.hero .h-t{font-size:21px;font-weight:800;color:var(--navy);line-height:1.3}
.hero .h-s{color:var(--text-soft);font-size:14.5px;margin-top:7px}
.brand small{color:var(--text-mute);font-weight:600;font-size:12px}
.topbar .spacer{flex:1}
.searchbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--bg-soft);color:var(--text-mute);cursor:pointer;font-size:13px;min-width:210px}
.searchbtn:hover{border-color:var(--accent)}
.searchbtn kbd{margin-left:auto;font-family:var(--sans);font-size:11px;color:var(--text-mute);border:1px solid var(--border-strong);border-radius:5px;padding:1px 6px;background:var(--bg)}
.iconbtn{width:34px;height:34px;border:1px solid var(--border-strong);border-radius:9px;background:var(--bg-soft);color:var(--text-soft);cursor:pointer;display:grid;place-items:center;font-size:15px}
.iconbtn:hover{border-color:var(--accent);color:var(--text)}
.menutoggle{display:none}

.layout{display:flex;padding-top:var(--topbar-h);min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:fixed;top:var(--topbar-h);bottom:0;left:0;overflow-y:auto;border-right:1px solid var(--border);background:var(--bg);padding:18px 14px 60px}
.sidebar::-webkit-scrollbar{width:9px}.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
.nav-group{margin-bottom:16px}
.nav-sec{font-size:10px;font-weight:800;letter-spacing:.09em;color:var(--accent-text);opacity:.85;text-transform:uppercase;padding:7px 10px 5px;margin:16px 0 2px;border-top:1px solid var(--border)}
.nav-sec:first-child{margin-top:2px;border-top:none}
.nav-group>.nav-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--text-mute);padding:7px 10px;cursor:pointer;user-select:none;border-radius:7px}
.nav-group>.nav-title:hover{background:var(--bg-soft);color:var(--text-soft)}
.nav-group>.nav-title .gt-chev{font-size:9px;opacity:.7;transition:transform .18s}
.nav-group.collapsed>.nav-title .gt-chev{transform:rotate(-90deg)}
.nav-group.collapsed .nav-items{display:none}
.nav-link{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--text-soft);font-size:14px;cursor:pointer;line-height:1.35}
.nav-link:hover{background:var(--bg-soft);color:var(--text);text-decoration:none}
.nav-link.active{background:var(--accent-soft);color:var(--accent-text);font-weight:650}
.nav-link .num{flex:0 0 auto;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--text-mute);min-width:20px}
.nav-link.active .num{color:var(--accent-text)}
.nav-link .done-dot{margin-left:auto;flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;font-size:9.5px;font-weight:900;color:transparent;transition:.2s}
.nav-link.is-read .done-dot{background:var(--tip-bd);border-color:var(--tip-bd);color:#fff}
.nav-link.is-read .done-dot:after{content:"✓"}
.nav-link[data-go="welcome"] .done-dot{visibility:hidden}
.nav-group>.nav-title .g-cnt{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--text-mute);font-variant-numeric:tabular-nums;letter-spacing:0}
.nav-group>.nav-title .g-cnt.full{color:var(--tip-bd)}

.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;justify-content:center}
.content{width:100%;max-width:830px;padding:34px 42px 110px}
.crumbs{font-size:12.5px;color:var(--text-mute);margin-bottom:10px;display:flex;gap:7px;align-items:center}
.crumbs .sep{opacity:.5}
h1.page-title{font-size:29px;line-height:1.24;letter-spacing:-.022em;font-weight:800;margin:2px 0 8px;color:var(--navy)}
.lede{font-size:16.25px;line-height:1.62;color:var(--text-soft);margin:0 0 28px}
.content h2{font-size:20.5px;line-height:1.3;letter-spacing:-.015em;font-weight:750;margin:42px 0 13px;padding-top:10px;color:var(--navy)}
.content h3{font-size:16px;line-height:1.4;letter-spacing:-.01em;font-weight:700;margin:26px 0 8px;color:var(--text)}
.content p{margin:13px 0}
.content ul,.content ol{margin:13px 0;padding-left:21px}
.content li{margin:6px 0}
.content li::marker{color:var(--text-mute)}
.content strong{font-weight:700}
hr.div{border:none;border-top:1px solid var(--border);margin:32px 0}

.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;vertical-align:middle}
.badge.b-core{background:var(--danger-bg);color:var(--danger-bd)}
.badge.b-new{background:var(--accent-soft);color:var(--accent-text)}
.badge.b-rec{background:var(--tip-bg);color:var(--tip-bd)}
.badge.b-day{background:var(--accent-soft);color:var(--accent-text)}

.callout{border:1px solid var(--border);border-left-width:4px;border-radius:10px;padding:14px 17px;margin:18px 0;background:var(--bg-soft);line-height:1.72}
.callout .co-h{font-weight:700;font-size:14px;letter-spacing:-.01em;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}
.callout.warn{border-left-color:var(--warn-bd);background:var(--warn-bg)}
.callout.note{border-left-color:var(--note-bd);background:var(--note-bg)}
.callout.tip{border-left-color:var(--tip-bd);background:var(--tip-bg)}
.callout.danger{border-left-color:var(--danger-bd);background:var(--danger-bg)}

code{font-family:var(--mono);font-size:.86em;background:var(--bg-soft);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
html[data-theme="dark"] code{background:#1d2230}

.tablewrap{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--bg-soft);font-weight:700;color:var(--text);white-space:nowrap;font-size:13px;letter-spacing:.01em}
tr:last-child td{border-bottom:none}
td code{white-space:nowrap}

.steps{counter-reset:st;margin:18px 0;padding:0;list-style:none}
.steps>li{position:relative;padding:2px 0 16px 42px;margin:0}
.steps>li:before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps>li:not(:last-child):after{content:"";position:absolute;left:13.5px;top:30px;bottom:2px;width:2px;background:var(--border-strong)}
.steps>li .st-h{font-weight:650}

.checklist{list-style:none;padding:0;margin:16px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.checklist li{display:flex;gap:11px;align-items:flex-start;padding:11px 15px;border-bottom:1px solid var(--border);cursor:pointer}
.checklist li:last-child{border-bottom:none}
.checklist li:hover{background:var(--bg-soft)}
.checklist input{margin-top:3px;width:17px;height:17px;accent-color:var(--tip-bd);flex:0 0 auto;cursor:pointer}
.checklist li.checked span{color:var(--text-mute);text-decoration:line-through}
.cl-head{display:flex;justify-content:space-between;align-items:center;background:var(--bg-soft);padding:9px 15px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text-soft)}
.cl-prog{font-variant-numeric:tabular-nums;color:var(--tip-bd)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0}
.card{border:1px solid var(--border);border-radius:11px;padding:14px 15px;background:var(--bg-elev)}
.card .c-t{font-weight:700;font-size:14px;margin-bottom:3px;color:var(--navy)}
.card .c-d{font-size:13px;color:var(--text-soft)}
.card a{font-size:13px}
.card[data-go]{cursor:pointer}
.card[data-go]:hover{border-color:var(--accent);box-shadow:var(--shadow)}

.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.val{text-align:center;border:1px solid var(--border);border-radius:12px;padding:18px 12px;background:var(--bg-elev)}
.val .vc{width:48px;height:48px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:20px;background:var(--accent)}
.val:nth-child(even) .vc{background:var(--navy)}
.val .vt{font-weight:800;color:var(--navy)}
.val .ve{font-size:11px;color:var(--text-mute);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.val .vd{font-size:12.5px;color:var(--text-soft);margin-top:4px}

.org{margin:18px 0}
.org .top{max-width:200px;margin:0 auto;background:var(--navy);color:#fff;text-align:center;font-weight:800;padding:10px;border-radius:9px}
.org .line{width:2px;height:18px;background:var(--border-strong);margin:0 auto}
.org .row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.org .dept{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--bg-elev)}
.org .dept .dh{background:var(--accent);color:#fff;font-weight:700;text-align:center;padding:9px}
.org .dept:nth-child(2) .dh{background:var(--text-mute)}
.org .dept ul{margin:0;padding:12px 12px 12px 28px;font-size:13px;color:var(--text-soft)}

.pager{display:flex;gap:14px;margin-top:48px}
.pager a{flex:1;border:1px solid var(--border);border-radius:11px;padding:14px 16px;display:block;color:var(--text)}
.pager a:hover{border-color:var(--accent);text-decoration:none;box-shadow:var(--shadow)}
.pager .pl{font-size:12px;color:var(--text-mute)}
.pager .pt{font-weight:650;margin-top:2px}
.pager .next{text-align:right}

.modal-bg{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:11vh}
.modal-bg.open{display:flex}
.modal{width:min(620px,92vw);background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.modal .m-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal input{flex:1;border:none;outline:none;background:transparent;font-size:16px;color:var(--text);font-family:var(--sans)}
.modal .m-res{max-height:54vh;overflow-y:auto;padding:6px}
.m-res .r{padding:10px 13px;border-radius:9px;cursor:pointer}
.m-res .r:hover,.m-res .r.sel{background:var(--accent-soft)}
.m-res .r .r-t{font-weight:650;font-size:14px}
.m-res .r .r-c{font-size:12px;color:var(--text-mute)}
.m-res .r .r-g{font-size:11px;color:var(--accent-text);font-weight:600}
.m-empty{padding:26px;text-align:center;color:var(--text-mute);font-size:14px}

@media(max-width:1000px){
  :root{--sidebar-w:0px}
  .menutoggle{display:grid}
  .sidebar{transform:translateX(-100%);transition:.22s;width:294px;flex-basis:294px;z-index:50;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .main{margin-left:0}
  .content{padding:24px 18px 90px}
  .searchbtn{min-width:0}.searchbtn .sb-txt,.searchbtn kbd{display:none}
  .brand small{display:none}
  .org .row{grid-template-columns:1fr}
  .hero{flex-direction:column;text-align:center;gap:14px}
}
.scrim{display:none;position:fixed;inset:0;top:var(--topbar-h);background:rgba(0,0,0,.35);z-index:45}
.scrim.open{display:block}
/* ===== 설정 패널 ===== */
.settings-wrap{position:relative}
.iconbtn svg{display:block}
.iconbtn.on{border-color:var(--accent);color:var(--accent-text)}
.settings-panel{position:absolute;right:0;top:calc(100% + 10px);width:300px;background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px 12px;display:none;z-index:60}
.settings-panel.open{display:block}
.set-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.set-label{font-weight:800;font-size:14px;width:40px;color:var(--text);flex:0 0 auto}
.seg{display:flex;gap:7px;flex:1}
.seg button{flex:1;padding:9px 4px;border:none;border-radius:10px;background:var(--bg-soft);color:var(--text-soft);font-size:13px;font-weight:700;cursor:pointer;transition:background .12s,color .12s}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--accent);color:#fff}
.set-row .sz-a{color:var(--text-mute);flex:0 0 auto}
.set-row .sz-a.sm{font-size:13px}
.set-row .sz-a.lg{font-size:20px;font-weight:800}
#szRange{flex:1;accent-color:var(--accent);cursor:pointer;height:4px}
.set-divider{height:1px;background:var(--border);margin:4px 0 10px}
.set-reset{width:100%;background:none;border:none;color:var(--text-mute);font-size:13px;font-weight:700;cursor:pointer;padding:8px;border-radius:9px}
.set-reset:hover{background:var(--bg-soft);color:var(--text)}
/* ===== 폰트 · 글자 크기 ===== */
html[data-font="serif"]{--sans:"AppleMyungjo","Nanum Myeongjo",Georgia,"Times New Roman",serif}
.content{zoom:var(--fz-zoom,1)}
/* ===== 우측 페이지 목차 ===== */
.toc{position:fixed;top:var(--topbar-h);right:0;width:264px;height:calc(100vh - var(--topbar-h));overflow-y:auto;padding:32px 22px 70px;display:none}
.toc-h{font-size:11.5px;font-weight:800;color:var(--text-mute);letter-spacing:.03em;margin-bottom:13px;text-transform:uppercase}
.toc-link{display:block;font-size:13px;color:var(--text-soft);padding:5px 12px;border-left:2px solid var(--border);line-height:1.45;cursor:pointer;text-decoration:none}
.toc-link.lvl3{padding-left:24px;font-size:12.5px;color:var(--text-mute)}
.toc-link:hover{color:var(--text);border-left-color:var(--border-strong)}
.toc-link.active{color:var(--accent-text);border-left-color:var(--accent);font-weight:700}
@media(min-width:1240px){body.has-toc .toc{display:block}body.has-toc .main{margin-right:264px}}
/* ===== UX 개선 ===== */
.readbar{position:fixed;top:var(--topbar-h);left:0;height:2px;width:0;background:var(--accent);z-index:41;transition:width .08s linear}
.totop{position:fixed;right:22px;bottom:24px;width:42px;height:42px;border-radius:50%;border:1px solid var(--border-strong);background:var(--bg-elev);color:var(--text-soft);font-size:19px;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s;z-index:50}
.totop.show{opacity:1;pointer-events:auto;transform:none}
.totop:hover{color:var(--text);border-color:var(--accent)}
@keyframes gtgFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.content.fade{animation:gtgFade .22s ease}
.nav-link,.card,.toc-link{transition:background .14s,color .14s,border-color .14s}
.card{transition:background .14s,border-color .14s,transform .14s}
.card:hover{transform:translateY(-1px)}
@media(prefers-reduced-motion:reduce){.content.fade{animation:none}.readbar,.totop,.card{transition:none}.card:hover{transform:none}*{scroll-behavior:auto!important}}
/* ===== UX 고도화 ===== */
::selection{background:var(--accent-soft);color:var(--accent-text)}
html{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.content h2,.content h3{scroll-margin-top:76px}
.toc::-webkit-scrollbar,.m-res::-webkit-scrollbar{width:9px}
.toc::-webkit-scrollbar-thumb,.m-res::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
.toc::-webkit-scrollbar-track,.m-res::-webkit-scrollbar-track,.sidebar::-webkit-scrollbar-track{background:transparent}
a:focus-visible,button:focus-visible,input:focus-visible,.card:focus-visible,.nav-link:focus-visible,.toc-link:focus-visible,.r:focus-visible,[data-go]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.nav-link{position:relative}
.nav-link.active{box-shadow:inset 2px 0 0 var(--accent)}
.crumbs a{color:var(--text-mute)}
.crumbs a:hover{color:var(--accent-text);text-decoration:none}
.tablewrap tbody tr{transition:background .12s}
.tablewrap tbody tr:hover{background:var(--bg-soft)}
.pager a{transition:border-color .14s,box-shadow .14s,transform .14s}
.pager a:hover{transform:translateY(-1px)}
.m-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-mute)}
.m-foot .keys{display:flex;gap:12px;flex-wrap:wrap}
.m-foot kbd{background:var(--bg-soft);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:11px;font-family:var(--sans)}
.m-res mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px;font-weight:700}
/* ===== UX 디벨롭 2차 ===== */
.card[data-go]{cursor:pointer}
.card[data-go]:hover{border-color:var(--accent)}
.resume-card{display:flex;align-items:center;gap:14px;border:1px solid var(--accent);border-radius:12px;padding:13px 17px;margin:0 0 18px;background:var(--accent-soft);cursor:pointer;transition:box-shadow .14s,transform .14s}
.resume-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.resume-card .rc-l{font-size:12px;font-weight:800;color:var(--accent-text);letter-spacing:.02em;flex:0 0 auto}
.resume-card .rc-t{font-weight:700;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume-card .rc-a{color:var(--accent-text);font-weight:800;flex:0 0 auto}
.prog-wrap{border:1px solid var(--border);border-radius:12px;padding:14px 17px;margin:0 0 18px;background:var(--bg-soft)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog-top .pg-l{font-size:13px;font-weight:800;color:var(--text)}
.prog-top .pg-n{font-size:12.5px;color:var(--text-soft);font-weight:700}
.prog-bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden}
.prog-bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s ease}
.nav-progress{margin:20px 4px 6px;padding:12px 12px 10px;border-top:1px solid var(--border)}
.nav-progress .np-t{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--text-mute);margin-bottom:7px}
.cl-head{display:flex;align-items:center;gap:8px}
.cl-reset{margin-left:auto;background:none;border:1px solid var(--border);border-radius:7px;color:var(--text-mute);font-size:11px;font-weight:700;padding:3px 9px;cursor:pointer;font-family:var(--sans)}
.cl-reset:hover{color:var(--danger-bd);border-color:var(--danger-bd)}
.m-sec{font-size:11px;font-weight:800;color:var(--text-mute);letter-spacing:.05em;padding:8px 13px 4px;text-transform:uppercase}
/* ===== UX 3차: 읽음 추적 · 학습 지도 · 페이지 정보 ===== */
.page-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:-8px 0 24px;font-size:12.5px;color:var(--text-mute)}
.page-meta .pm{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;background:var(--bg-soft);border:1px solid var(--border);font-weight:600}
.page-meta .pm.read{color:var(--tip-bd);border-color:color-mix(in srgb,var(--tip-bd) 40%,transparent);background:var(--tip-bg)}
.kv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px;font-size:13.5px}
.kv .k{font-size:12px;font-weight:800;color:var(--text-mute);letter-spacing:.02em}
.kv .v{padding:3px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.course{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin:16px 0}
.cs{border:1px solid var(--border);border-radius:12px;padding:15px 16px 14px;background:var(--bg-elev);cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .14s,box-shadow .14s,transform .14s}
.cs:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.cs .cs-sec{font-size:10.5px;font-weight:800;color:var(--accent-text);letter-spacing:.04em}
.cs .cs-t{font-weight:800;font-size:15px;color:var(--navy);line-height:1.35}
.cs .cs-d{font-size:13px;color:var(--text-soft);line-height:1.55;flex:1}
.cs .cs-f{display:flex;align-items:center;gap:9px;margin-top:8px;font-size:12px;color:var(--text-mute);font-weight:700;font-variant-numeric:tabular-nums}
.cs .cs-f .prog-bar{flex:1;height:5px}
.cs .cs-go{color:var(--accent-text);white-space:nowrap}
.cs.done{border-color:color-mix(in srgb,var(--tip-bd) 45%,transparent)}
.cs.done .prog-bar>i{background:var(--tip-bd)}
.cs.done .cs-go{color:var(--tip-bd)}
.todo-card{display:flex;align-items:center;gap:14px;border:1px solid color-mix(in srgb,var(--warn-bd) 45%,transparent);border-radius:12px;padding:13px 17px;margin:0 0 18px;background:var(--warn-bg);cursor:pointer}
.todo-card:hover{box-shadow:var(--shadow)}
.todo-card .rc-l{font-size:12px;font-weight:800;color:var(--warn-bd);flex:0 0 auto}
.todo-card .rc-t{font-weight:700;flex:1;min-width:0}
.todo-card .rc-a{font-weight:800;color:var(--text-soft);flex:0 0 auto;font-variant-numeric:tabular-nums}
.toc-inline{display:none;border:1px solid var(--border);border-radius:11px;background:var(--bg-soft);margin:0 0 24px}
.toc-inline summary{cursor:pointer;padding:10px 15px;font-size:13px;font-weight:800;color:var(--text-soft);list-style:none;display:flex;justify-content:space-between}
.toc-inline summary::-webkit-details-marker{display:none}
.toc-inline summary:after{content:"▾";font-size:10px;opacity:.7}
.toc-inline[open] summary:after{transform:rotate(180deg)}
.toc-inline .ti{padding:0 8px 9px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px 8px}
.toc-inline .ti a{display:block;padding:5px 8px;font-size:13.5px;color:var(--text-soft);border-radius:7px;cursor:pointer}
.toc-inline .ti a:hover{background:var(--bg);color:var(--accent-text);text-decoration:none}
@media(max-width:1239px){.toc-inline{display:block}}
@keyframes gtgFlash{0%,45%{background:color-mix(in srgb,var(--warn-bd) 30%,transparent)}100%{background:transparent}}
.flash{animation:gtgFlash 2.4s ease;border-radius:6px}
.set-reset.sub{font-weight:600;font-size:12.5px}
@media(max-width:600px){.page-meta{margin-top:-4px}.resume-card .rc-l,.todo-card .rc-l{display:none}}
@media print{
  .topbar,.sidebar,.toc,.totop,.readbar,.scrim,.pager,.settings-panel,.modal-bg,.cl-reset{display:none!important}
  .main{margin:0!important}.content{max-width:100%!important;padding:0!important}
  body{font-size:11.5pt;background:#fff;color:#111}
  .callout,.card,.tablewrap{break-inside:avoid}
  h1.page-title{margin-top:0}
}

about:{n:"",title:"회사 소개",group:"회사 소개",
 lede:"좋은 기업에서 위대한 기업으로 — 광고주와 함께 성장하는 최고의 마케팅 파트너.",
 html:`
 <p><b>GOOD TO GREAT</b>는 「Good to Great」의 철학을 바탕으로 설립된 <b>종합광고대행사</b>입니다. 기존 바이럴 마케팅 분야에서 전문성과 성과를 쌓아온 핵심 인재들이 모여 <b>2024년 설립</b>되었으며, 광고대행 및 미디어렙 사업을 전개하고 있습니다.</p>
 <p>우리는 단순한 광고 집행을 넘어 광고주의 <b>브랜드 가치와 비즈니스 성장</b>을 함께 고민하는 마케팅 파트너를 지향합니다. 바이럴 마케팅을 기반으로 검색광고, 콘텐츠 마케팅, 플레이스 마케팅, IMC 마케팅 등 다양한 영역으로 사업을 확장하며 <b>통합 마케팅 솔루션</b>을 제공합니다.</p>
 <p>데이터 기반의 전략과 창의적인 아이디어, 책임감 있는 실행력을 바탕으로 고객과 함께 성장하며 더 큰 가치를 만들어가는 종합광고대행사로 나아가고 있습니다.</p>
 <h2>우리 포지션 — "실행하는 대행사" ★</h2>
 <div class="tablewrap"><table>
 <tr><th>구분</th><th>특징</th></tr>
 <tr><td>대행사</td><td>영업만, 실행 안 함 (실행은 우리 같은 곳에 맡김)</td></tr>
 <tr><td>실행사(시행사)</td><td>실행만, 영업 안 함 (대행사가 거래처)</td></tr>
 <tr><td><b>우리</b></td><td><b>영업 + 실행 둘 다</b> — 대행사와 실행사의 중간</td></tr>
 </table></div>
 <ul>
   <li>주력 = <b>마케팅 상품 판매</b>(매출의 절반 이상), 광고주 = 인하우스(브랜드) 마케터·대표들</li>
   <li><b>경쟁력 3요소</b>: ① 보유·실행 가능한 마케팅 상품의 수 ② 원가에 가까운 외주 라인(항상 1차 라인 지향) ③ 자체 실행팀(협력마케팅팀·운영팀) 보유 — 20명 규모 팀 단위 대행사</li>
 </ul>
 <div class="callout note"><div class="co-h">리뷰 사업 한눈에</div><p>쿠팡·스마트스토어 <b>리뷰 체험단 / 가구매 · 상위노출</b>을 한 곳에서. 광고주는 운영에만 집중하고 나머지는 굿투가 처리합니다. (건당 1,000원~10,000원)</p></div>
 <div class="cards">
   <div class="card"><div class="c-t">월 누적 30,000건</div><div class="c-d">리뷰 실행 규모 (월 200개/일 수준)</div></div>
   <div class="card"><div class="c-t">평균 모집률 100%+</div><div class="c-d">전담 매니저 배정 · 맞춤 결과 레포트</div></div>
   <div class="card"><div class="c-t">리뷰어 3,000명+</div><div class="c-d">누적 회원 보유</div></div>
 </div>
 <h2>이름의 유래 & 지향</h2>
 <p>짐 콜린스의 베스트셀러 「좋은 기업에서 위대한 기업으로(Good to Great)」에서 영감을 받았습니다. 바이럴 마케팅에 강점을 가진 핵심 인재들이 모여 <b>서울·인천</b>에 근거지를 두고 광고대행업·매체영업을 전개하며, 애드네트워크 사업을 출범했습니다. 향후 검색광고·IMC·해외 플랫폼 마케팅까지 확장해 <b>종합 마케팅 대행사</b>로 성장하는 것이 목표입니다.</p>
 <h2>성장 로드맵</h2>
 <div class="tablewrap"><table>
 <tr><th>시기</th><th>마일스톤</th></tr>
 <tr><td>2024.07</td><td>바이럴 마케팅 시작</td></tr>

 </table></div>
 `},

   <li><span class="st-h">리뷰어 제품 구매</span> → 구매 리스트 전달</li>
   <li><span class="st-h">빈박/실제품 출고 → 배송완료</span> — 택배대행 시 굿투가 송장 요청 후 업체 전달</li>
   <li><span class="st-h">리뷰 작성</span> → 업체·리뷰어 관리</li>
 </ul>
 <h2>오전 고정 루틴</h2>
 <ul class="steps">
   <li><span class="st-h">09:30</span> A사 전일 저녁건 가격변동 영수증 승인</li>
   <li><span class="st-h">10:00</span> A사 전일 리스트 송부</li>
   <li><span class="st-h">10:30 (월요일)</span> 주말 진행 모든 캠페인 리스트 송부 완료</li>
   <li><span class="st-h">이후</span> 오전 송부 대상 영수증 승인 → 오전 리스트 송부</li>
 </ul>
 `},

aeo_geo:{n:"",title:"AEO / GEO 상세",group:"서비스 & 상품",
 lede:"\"AI를 선도해야 브랜드가 성장합니다\" — 검색하는 브랜드에서, AI가 가장 먼저 언급하는 브랜드로.",
 html:`
 <h2>AEO · GEO란?</h2>
 <ul><li><b>AEO (Answer Engine Optimization)</b> — 답변엔진 최적화. 답변 엔진 응답에 우리 브랜드가 가장 먼저 인용되도록 설계. (SEO가 1페이지 경기라면, AEO는 답변 박스에 직접 들어가는 경기)</li><li><b>GEO (Generative Engine Optimization)</b> — 생성형엔진 최적화. ChatGPT·Gemini·Perplexity·Claude 응답 안에 브랜드가 자연스럽게 언급되도록 학습 소스 전반을 설계.</li></ul>
 <h2>SEO vs AEO vs GEO</h2>
 <div class="tablewrap"><table>
 <tr><th>구분</th><th>SEO</th><th>AEO</th><th>GEO</th></tr>
 <tr><td>대상</td><td>구글·네이버 검색</td><td>SGE·큐:·Copilot</td><td>ChatGPT·Gemini·Perplexity·Claude</td></tr>
 <tr><td>목표</td><td>검색 상위 노출</td><td>답변 박스 내 인용</td><td>AI 응답 내 브랜드 언급</td></tr>
 <tr><td>핵심 작업</td><td>키워드·백링크·테크니컬</td><td>Schema·FAQ·구조화 콘텐츠</td><td>외부 소스 분산·내러티브 일관성</td></tr>
 <tr><td>지표</td><td>검색 순위·유입</td><td>답변 인용률·스니펫 점유</td><td>AI 답변 점유율·언급 빈도</td></tr>
 </table></div>
 <div class="callout note"><p>AEO·GEO는 SEO를 <b>대체하지 않고 그 위에 얹히는 레이어</b>입니다. 기본 검색 가시성이 약하면 작동하지 않아요.</p></div>
 <h2>해결하는 4가지 문제</h2>
 <div class="tablewrap"><table>
 <tr><th>문제</th><th>상태</th></tr>
 <tr><td>Search Void</td><td>검색해도 브랜드가 안 나옴 → 고객이 이미 경쟁사 선택</td></tr>
 <tr><td>Trust Gap</td><td>결과는 있으나 신뢰 부족 (E-E-A-T 신호 부족)</td></tr>
 <tr><td>Community Silence</td><td>커뮤니티·리뷰 언급이 없어 AI 학습 데이터 부재</td></tr>
 <tr><td>AI Exclusion</td><td>AI 답변에 경쟁사만 인용됨</td></tr>
 </table></div>
 <h2>3대 전략</h2>
 <ul class="steps"><li><span class="st-h">SEO Foundation</span> 테크니컬 SEO·키워드 아키텍처·사이트 구조 재정비</li><li><span class="st-h">Trust Architecture</span> 전문가 콘텐츠·외부 인용/백링크·리뷰·커뮤니티 노출</li><li><span class="st-h">AI Intelligence</span> LLM 학습 소스 최적화·Schema/FAQ 구조화·AI 답변 점유 모니터링</li></ul>
 <h2>실행 프로세스</h2>
 <p><b>AEO 3단계:</b> ① 질문-답변 구조 재설계(Q&A·FAQ·HowTo Schema) ② 인용 친화적 설계(명확·간결한 답변) ③ E-E-A-T 강화</p>
 <p><b>GEO 3단계:</b> ① LLM 소스 분산(Wikipedia·Reddit·언론·블로그) ② 브랜드 내러티브 일관성 ③ 크로스 플랫폼 언급 빈도 축적</p>
 <h2>FAQ 요약</h2>
 <ul><li><b>SEO도 필요?</b> 필요. AEO/GEO는 SEO 위 레이어</li><li><b>계약 기간?</b> 최소 3개월, 권장 6개월+</li><li><b>로컬 비즈니스?</b> 가능, 오히려 효과 큰 영역(학원·병원·식당·뷰티)</li><li><b>성과 측정?</b> AI 답변 점유율·인용률·언급 빈도·유입·상담 전환 (월간 리포트+경쟁사 갭 분석)</li></ul>
 <h2>사내 현황</h2>
 <ul>
   <li><b>자체 분석 툴 보유</b> → 제안서 제작·배포 중. 매우 핫하고 <b>부가가치 높은 신사업</b></li>
   <li><b>지식인 상품은 AEO/GEO에 걸리게 하는 용도</b>로 결합 판매 (단독 판매 X)</li>
 </ul>
 `},

kb_platform:{n:"",title:"⓪-2 플랫폼 로직 심화 (플레이스 · 네이버 쇼핑 · 쿠팡)",group:"리뷰 마케팅 지식",
 lede:"트래픽·슬롯 개념부터 플레이스 N1/N2, 네이버 쇼핑 SEO, 쿠팡 전환율 로직까지 — 팀장 마케팅 교육(2026-09) 핵심 정리. \"거래처에도 잘 안 알려주는 내용\"이니 꼭 익혀두세요.",
 html:`
 <div class="callout note"><div class="co-h">마인드셋</div><p>무슨 상품을 / 왜 / 어떻게 파는지 이해하는 것이 목표. 마케팅으로 돈을 벌거나 경력을 쌓으려면 <b>로직 공부 + 계속 바뀌는 플랫폼 업데이트를 스스로 따라가는 것</b>이 필수입니다. (GPT 활용·쿠팡/네이버 규정 직접 찾아보기 권장)</p></div>
 <h2>업의 정의 — 퍼포먼스 vs 바이럴</h2>
 <div class="tablewrap"><table>
 <tr><th>구분</th><th>내용</th></tr>
 <tr><td>퍼포먼스(퍼마)</td><td>매체에 CPC를 돌려 효율(CPA 등)을 뽑음 — 인하우스·브랜드 내부</td></tr>
 <tr><td><b>바이럴(우리)</b></td><td>검색·노출 작업 — 트래픽·리뷰·콘텐츠 상위노출(플레이스·쇼핑·블로그·카페·언론)</td></tr>
 </table></div>
 <p>목적은 하나 = <b>매출 상승</b>, 그 전제는 <b>노출</b>. 소비자 흐름: <b>상위 노출 → 리뷰 확인 → 신뢰 → 구매 전환</b>. 광고주 ↔ 대행사는 <b>공생관계</b>(악어와 악어새). 영업부=방향/로드맵, 실행 부서=시스템대로 실행.</p>
 <div class="callout note"><div class="co-h">광고주 유형 (접수 때 바로 마주치는 개념)</div><ul>
   <li><b>플레이스 사업자 vs 쇼핑 사업자</b></li>
   <li><b>프랜차이즈 vs 브랜드</b> / <b>매장 광고주 vs 유통 광고주</b></li>
   <li>유입 경로 차이: 플레이스 / 리뷰 / 쇼핑 트래픽</li>
 </ul></div>

 <h2>트래픽 · 슬롯 개념</h2>
 <ul>
   <li><b>트래픽 = 1클릭 1유입.</b> 플랫폼은 클릭·체류시간·행동을 실시간 수집 → "인기 있다"고 인지 → 순위 근거</li>
   <li>종류는 딱 둘: <b>리워드(사람)</b> / <b>프로그램</b></li>
   <li><b>슬롯 = 수량 표기 '단위'</b>(cm 같은 단위). 트래픽과 다른 개념이 아님 — 트래픽 도구에서 "N슬롯 세팅"의 한 행이 1슬롯, 시장 평균 <b>1슬롯 ≈ 100유입</b>(500유입=5슬롯)</li>
   <li>감 잡기: 토스 앱의 미션(출석체크·태그 찾기)을 해보면 유입이 만들어지는 과정이 보임</li>
   <li>※ 협력마케팅팀은 트래픽을 몰라도 업무에 큰 지장은 없음(알면 좋음)</li>
 </ul>
 <div class="callout tip"><div class="co-h">플랫폼과 매체사 — 트래픽이 실제로 발생하는 구조</div><p><b>플랫폼</b> = 리워드 트래픽을 실현(발생)시키는 시스템 (예: 자몽랩·이음·원픽·NEO)<br><b>매체사</b> = 플랫폼에서 만든 트래픽을 사용자에게 노출시키는 곳 (예: OK캐시백·토스)<br>흐름: <b>플랫폼 → 매체사 노출 → 트래픽 발생</b></p></div>
 <p>실무(접수·오픈)에서는 "트래픽 상품"과 "슬롯 상품"을 아래처럼 구분해 다룹니다.</p>
 <div class="tablewrap"><table>
 <tr><th>구분</th><th>트래픽 (= 리워드)</th><th>슬롯</th></tr>
 <tr><td>단위</td><td>100타·1타·50타 등 <b>"타수"</b></td><td>1슬롯·2슬롯 등 <b>"슬롯"</b></td></tr>
 <tr><td>개념</td><td>오픈이 아닌 <b>접수</b></td><td>계정에 슬롯을 <b>오픈</b>해주는 것</td></tr>
 <tr><td>기간 · 필요 정보</td><td>접수 시 <b>일 건수 + 총 구동일</b> 필요</td><td>보통 1슬롯에 <b>10일 또는 30일</b> 기본 (일할 = 일 단위 진행)</td></tr>
 <tr><td>진행 시점</td><td>당일 진행되는 경우 있음</td><td>대부분 <b>익일부터</b> 진행</td></tr>
 <tr><td>마감 시간</td><td>리워드마다 접수 마감 다름</td><td>프로그램마다 오픈·세팅 마감 다름</td></tr>
 <tr><td>유입 주체</td><td><b>실제 사람</b></td><td>사람이 아닌 <b>매크로(프로그램)</b></td></tr>
 </table></div>

 <h2>리뷰 진행 방식 정리</h2>
 <ul>
   <li><b>리뷰어 진행</b>: 가구매(빈박스) / 실배송 / 구매확정 · <b>자동구매(보유 계정)</b>: 가구매 / 회수형</li>
   <li>플랫폼 차이: 스마트스토어=별점 없음→<b>구매확정 작업</b> / 쿠팡=구매확정 없음→<b>별점 리뷰</b></li>
   <li>포토리뷰: 실배송만 자유 요청 가능. 가구매·구매확정은 불가(단, <b>업체가 사전 포토 전달 시 반영 가능</b>)</li>
   <li>쿠팡 로켓/그로스 고가 상품은 키워드 구매 금액이 안 맞아 <b>회수형</b>으로 진행하는 경우 많음</li>
 </ul>

 <h2>플레이스 로직 — N1 / N2</h2>
 <ul>
   <li>노출 지수: 유사도 / 인기도 / <b>거리(행정주소 기반)</b> / 정보의 충실성 — 타 동네로는 노출 불가, "동네명+업종"으로 검색해야 위치 반영</li>
   <li><b>N1 = 유사도</b>(대표 키워드·위치·업종·카테고리 적합) / <b>N2 = 로직 값</b>(트래픽·블로그·영수증·예약 리뷰) / N3≈N2</li>
   <li>순위 = <b>N1이 맞다는 전제에서 N2 높은 순</b> → 트래픽을 하는 이유 = N2를 올려 순위↑. 키워드별 N1/N2 수치는 분석 툴(에드로그)로 확인해 광고주 레퍼런스로 제시</li>
 </ul>

 <h2>네이버 쇼핑 로직 ★ (고가 정보)</h2>
 <ul>
   <li>네이버 = <b>검색 엔진</b> → 판매량만으론 안 오름. <b>SEO가 기본 디폴트</b>(안 맞으면 지수 높아도 순위 안 오름)</li>
   <li>SEO 핵심 3개만: <b>키워드 · 속성 · 상세페이지</b> (+상품명·모델명·대표이미지 일관성)</li>
   <li>순위 = 상품명 SEO + 구매점수 + 트래픽점수 + 클릭점수 + 리뷰점수 종합, <b>점수 리셋 주기 = 6개월</b></li>
   <li>자체 분석: 1~100위의 적합(SEO)/품질/리뷰·판매·클릭 점수 비교 → <b>부족한 지표를 골라 가구매 30~50개</b> (막연히 리뷰 쌓기가 아님)</li>
   <li>순위 2종: 플러스 쇼핑 vs 가격비교(전환 중) — <b>우리는 '가격비교' 순위 작업</b></li>
 </ul>
 <div class="callout tip"><div class="co-h">상품명 작성 규칙 (가장 어려워하는 부분)</div><p>패턴 A: <code>메인키워드 + 서브1·2·3 + 단위값 + 모델명</code> / 패턴 B: <code>브랜드 + 메인키워드 + 상품명 + 용량·수량·서브 + 단위</code><br>예: <code>신일선풍기 + 저소음/스탠드/가정용선풍기 + 35cm + 모델명</code> — <b>공백 포함 40자 내외</b>, 2~3번 조정하면 맞음. <b>상품명만 잘 맞춰도 1600등 → 800등</b>(돈 안 들이고).</p></div>

 <h2>네이버는 왜 '공식'을 쓰나 (블라인드 이해)</h2>
 <ul>
   <li>스마트스토어엔 <b>리뷰 클렌징 시스템</b>(21.1 도입, AI 탐지) — 이상 패턴이면 블라인드</li>
   <li>리뷰어 블라인드가 높은 이유: 물류 마감에 맞춰 <b>캠페인 시간대가 몰림</b> → 동일 시간대·패턴·단말기·IP·결제수단 반복 → 탐지. <b>신규 상품일수록 블라인드↑</b></li>
   <li>직원 IP가 스토어 로그인 계정과 겹친 주문 → 연관성으로 자동 블라인드 + 포인트 회수</li>
   <li><b>'공식'</b>은 자기 계정으로 속도·개수를 조절하며 진행 → 당일 접수 안 받음(스케줄 꼬임 방지) → 블라인드율 낮음, 블라인드 시 한 달 후기 AS 가능</li>
   <li>그래서 리뷰어는 네이버 참여 저조(고액만 참여) — 쿠팡은 1만원대도 다 참여</li>
 </ul>

 <h2>쿠팡 로직 — 전환율 중심</h2>
 <ul>
   <li>쿠팡 = <b>판매 플랫폼</b> → SEO 개념 거의 없음(카테고리 매칭은 필수), <b>전환 잘 나오는 상품을 상단에</b>. API 비공개</li>
   <li><b>링크 구매 = 비정상 경로</b>(정상은 검색→클릭→구매) — 과다 시 순위 날아감(예: 하루 100개×5일 위험). <b>키워드 구매 = 정상 경로 인정 + 전환율 반영</b> (전환율 지표는 쿠팡 '비즈니스 인사이트'에서 확인. 검색순위 알고리즘은 24년 공정위 문서에 공개됨)</li>
   <li>가구매로 전환율을 높이는 이유 = 상단 노출 → <b>CPC 광고비 세이브</b>(성수기 하루 100만원 태우는 셀러와 20만원으로 비슷한 매출)</li>
 </ul>
 <div class="tablewrap"><table>
 <tr><th>쿠팡 배송 유형</th><th>판매/재고/배송</th><th>실무 포인트</th></tr>
 <tr><td>로켓(1P)</td><td>쿠팡 매입·가격결정 / 쿠팡 / 쿠팡</td><td><b>주문자 정보를 판매자가 못 봄</b> → 악질 반품 색출 어려움, 총 건수로 대조</td></tr>
 <tr><td>로켓그로스(2P)</td><td>광고주 / 판매자 관리 / 쿠팡 창고</td><td>뺄 때 위약금 큼 → <b>회수형으로 터는 케이스</b></td></tr>
 <tr><td>판매자배송(3P)</td><td>판매자 / 판매자 / 판매자(윙 관리)</td><td>일반택배·택배대행</td></tr>
 </table></div>
 <ul>
   <li><b>윈(위너) 링크</b>: 노출 ID가 동일해 판매자 상품 리뷰가 그로스 상품에도 묶여 보임 → 가구매로 리뷰만 쌓고 싶을 때 활용</li>
   <li><b>CPC 낭설 주의</b>: "CPC 클릭 후 구매하면 순위 오른다"는 잘못된 정보 → <b>가구매 시 메인 CPC 키워드는 제외</b>(광고 클릭 구매 시 광고비 낭비)</li>
   <li><b>필터를 거는 이유</b>: 신규·초보 셀러는 상위 노출이 어려워 필터로 앞단 노출 → 리뷰어가 찾기 쉬움 + 검색 쿼리 기반이라 <b>메인 키워드 구매로 인정</b></li>
 </ul>

 <h2>실무 팁 (Q&A)</h2>

kb_ranking:{n:"",title:"⓪ 네이버 랭킹 로직 · 우리 상품의 존재 이유",group:"리뷰 마케팅 지식",
 lede:"\"클릭수를 높이려고 트래픽을 팔고, 판매실적·구매평을 높이려고 리뷰를 파는 겁니다.\" — 대표님 마케팅 상품 교육(2026-07) 핵심 이론.",
 html:`
 <h2>검색 결과 구조 (예: '수분크림')</h2>
 <p>최상단 <b>파워링크(광고)</b> → <b>네이버 가격비교</b> → (키워드에 따라) 플레이스 순. 가격비교 리스트의 <b>기본 정렬 = 네이버 랭킹순</b> — 그래서 랭킹 로직이 곧 매출입니다.</p>
 <h2>네이버 랭킹 3요소 ★</h2>
 <div class="tablewrap"><table>
 <tr><th>지수</th><th>내용</th><th>승부처?</th></tr>
 <tr><td>적합도</td><td>검색어-상품 정보 연관도, 카테고리 선호도</td><td>다들 맞춰 등록 → 차이 거의 없음</td></tr>
 <tr><td>신뢰도</td><td>가격비교 페널티(배송·응대) + 상품명 SEO</td><td>페널티는 다들 관리(2~3%, 보름~한 달 소멸), SEO도 기본은 다 앎 → 차이 미미</td></tr>
 <tr><td><b>인기도</b></td><td><b>클릭수 + 판매실적 + 구매평(리뷰) + 최신성</b></td><td><b>여기서 승부가 갈림</b></td></tr>
 </table></div>
 <div class="callout note"><div class="co-h">결론 — 우리 상품의 존재 이유</div><p><b>클릭수</b>를 높이려고 <b>트래픽</b>을 팔고, <b>판매실적·구매평</b>을 높이려고 <b>리뷰</b>를 파는 것. 돈 많은 브랜드는 CPC(파워링크·GFA·메타 등)로 해결하지만, 그게 안 되는 중소 셀러는 <b>트래픽+리뷰로 인기도를 만들어 상위 노출</b>. 이 원리는 <b>검색창이 있는 모든 채널</b>(쿠팡 포함)에 통용됩니다.</p></div>
 <h2>리워드 트래픽 이해 (주력 상품 1)</h2>
 <ul>
   <li><b>트래픽</b> = 내 사이트/가게에 방문을 만들어주는 것 (온라인의 '손님')</li>
   <li><b>역사</b>: 과거 프로그램(툴) 트래픽(서버+VPN으로 검색·클릭·체류 조작) → 네이버 AI가 어뷰징 패턴 감지·차단 → 현재는 <b>실제 사람이 방문하는 리워드 트래픽</b>으로 정착</li>
   <li><b>구조</b>: 뿌리는 오퍼월 광고(무료 충전소) → 퀴즈·방문·길찾기 캠페인으로 진화. 매체 = OK캐시백·카드 포인트·캐시슬라이드·<b>토스(현재 최대)</b>·카카오페이 등 핀테크 앱</li>
   <li><b>흐름</b>: 매체에 캠페인 노출 → 사람이 포인트 받으러 진입 → <b>진짜 사람이 내 상품/가게 방문</b> = 인기도(클릭수) 상승</li>
   <li><b>vs CPC</b>: CPC는 비싸서 돈 있는 브랜드만 가능 — 리워드 트래픽은 광고비의 몇 분의 일로 1페이지 노출 유도</li>
 </ul>
 <h2>리뷰 마케팅 이해 (주력 상품 2 — 협력마케팅팀의 존재 이유)</h2>
 <ul>
   <li>10년 넘은 상품이자 <b>인기도의 척도</b>. "리뷰는 계속 팔아야 되는 좋은 먹거리 — 그래서 협력마케팅팀을 강화한다" (대표님)</li>
   <li><b>네이버 vs 쿠팡</b>: 네이버=포털 개념 / 쿠팡=쇼핑몰 개념 → 접근·제안 방식이 다름</li>
   <li><b>블라인드율</b>: 쿠팡이 네이버보다 낮음(로켓·실배송 중심이라 "정말 아니다" 싶을 때만 거름) / 네이버는 이상 신호만 잡혀도 필터링</li>
   <li>필터링 고도화: IP·접속 경로·<b>직전 페이지</b>까지 봄 → 자연스러운 유입·분산이 중요한 이유</li>
 </ul>
 <h2>함께 알아둘 구분</h2>
 <div class="tablewrap"><table>
 <tr><th>구분</th><th>내용</th></tr>
 <tr><td>체험단 vs 기자단</td><td><b>체험단</b>=제품 제공/방문 후 직접 체험 리뷰 / <b>기자단</b>=방문·제품 없이 원고·사진 제공받아 작성</td></tr>
 <tr><td>플레이스 일반키 vs 맛집키</td><td><b>맛집키</b>=음식·카페·디저트 등 먹는 것 키워드 / <b>일반키</b>=안과·헬스장·고시원 등. <b>네이버가 분리 운영 → 순위 올리는 방법이 다름.</b> 원리는 동일(인기도=트래픽+리뷰)이나 플레이스 리뷰는 구매 리뷰가 아닌 <b>블로그·영수증·예약 리뷰</b><br>· 전략: <b>일반키</b> → 인기도를 높인다 / <b>맛집키</b> → 트래픽을 높이고 블로그·영수증 리뷰를 늘려 노출 순위를 올린다</td></tr>
 <tr><td>CPC / CTR</td><td><b>CPC</b>(Cost Per Click) = 광고 1클릭당 내는 돈 / <b>CTR</b>(클릭률) = 광고 노출 대비 클릭 비율. 광고주 상담 때 자주 나오니 알아둘 것</td></tr>
 <tr><td>서포터즈 인플루언서</td><td>인스타그램 등 <b>모든 SNS 채널의 인플루언서를 통칭</b>하는 말. 블로그·인스타 등 특정 채널에 한정된 개념이 아님</td></tr>
 </table></div>
 <div class="callout note"><div class="co-h">앞으로 중요해지는 것</div><p><b>AEO·GEO 마케팅</b>(<a data-go="aeo_geo">상세</a>)과 <b>AI 상세페이지</b>(단가가 저렴하고 퀄리티가 좋아 판매 중)의 비중이 커지는 중입니다.</p></div>
 <div class="callout tip"><div class="co-h">한 줄 정리</div><p>"광고비 없이 순위를 올리는 방법은 <b>인기도</b>를 만드는 것 — 클릭은 <b>트래픽</b>으로, 판매·리뷰는 <b>리뷰 마케팅</b>으로. 우리는 그 상품을 팔고, <b>직접 실행하는 회사</b>."</p></div>
 <div class="callout tip"><p>회사 포지션은 <a data-go="about">회사 소개</a>, 상품별 현황은 <a data-go="svc_catalog">마케팅 상품 15종</a>, 리뷰 실무는 <a data-go="routine">실무 가이드</a>.</p></div>
 `},

kb_store:{n:"",title:"③ 스마트스토어·네이버 리뷰",group:"리뷰 마케팅 지식",
 lede:"플랫폼 특성을 이해하고, 자연스러운 운영으로 콘텐츠 자산을 쌓는다.",

const order=GROUPS.flatMap(g=>g.pages);
const elNav=document.getElementById('sidebar');
const elContent=document.getElementById('content');
const clKey=(cl,i)=>`gtg_cl_${cl}_${i}`;

function navOpenSet(active){
  let s=null; try{s=JSON.parse(localStorage.getItem('gtg_open'));}catch(e){}
  const ag=GROUPS.find(g=>g.pages.includes(active));
  if(!Array.isArray(s)) s=ag?[ag.id]:GROUPS.map(g=>g.id);
  if(ag&&!s.includes(ag.id)) s.push(ag.id);
  return new Set(s);
}
function buildNav(active){
  const open=navOpenSet(active);
  let curSec=null;
  elNav.innerHTML=GROUPS.map(g=>{
    let head='';
    if(g.sec&&g.sec!==curSec){head=`<div class="nav-sec">${g.sec}</div>`;curSec=g.sec;}
    return head+`
   <div class="nav-group ${open.has(g.id)?'':'collapsed'}" data-group="${g.id}">
     <div class="nav-title" data-toggle="${g.id}"><span>${g.title}</span><span class="g-cnt" data-gcnt="${g.id}"></span><span class="gt-chev">▾</span></div>
     <div class="nav-items">${g.pages.map(pid=>{const pg=P[pid];return `<a class="nav-link ${pid===active?'active':''}" data-go="${pid}"><span class="num">${pg.n?pg.n.replace('Phase ','P'):''}</span><span>${pg.title}</span><span class="done-dot"></span></a>`;}).join('')}</div>
   </div>`;}).join('');
  refreshReadUI();
}
let curPid=null,readArmed=false,readTimer=null;
function render(pid,push){
  const pg=P[pid]; if(!pg)return;
  curPid=pid;
  buildNav(pid);
  const idx=order.indexOf(pid), prev=idx>0?order[idx-1]:null, next=idx<order.length-1?order[idx+1]:null;
  const grp=GROUPS.find(g=>g.pages.includes(pid)), gp=grp&&grp.pages.find(p=>P[p]);
  elContent.innerHTML=`
    <div class="crumbs">${gp&&gp!==pid?`<a data-go="${gp}">${pg.group}</a>`:`<span>${pg.group}</span>`}${pg.n?`<span class="sep">›</span><span>${pg.n}</span>`:''}</div>
    <h1 class="page-title">${pg.title}</h1>
    ${pg.lede?`<p class="lede">${pg.lede}</p>`:''}
    ${pid==='welcome'?'':`<div class="page-meta"><span class="pm">⏱ 약 ${readMinutes(pg)}분</span><span class="pm read" id="pmRead" ${isRead(pid)?'':'hidden'}>✓ 읽음</span></div>`}
    ${pg.html}
    <div class="pager">
      ${prev?`<a data-go="${prev}"><div class="pl">← 이전</div><div class="pt">${P[prev].title}</div></a>`:`<span style="flex:1"></span>`}
      ${next?`<a class="next" data-go="${next}"><div class="pl">다음 →</div><div class="pt">${P[next].title}</div></a>`:`<span style="flex:1"></span>`}
    </div>`;
  hydrateChecklists(); window.scrollTo(0,0); buildToc();
  elContent.classList.remove('fade'); void elContent.offsetWidth; elContent.classList.add('fade');
  scrollActiveNavIntoView(); onScroll();
  saveVisit(pid); if(pid==='welcome')welcomeExtras();
  if(push!==false&&location.hash!=='#'+pid) history.pushState(null,'',`#${pid}`);
  document.title=(pid==='welcome'?'':pg.title+' · ')+'GOOD TO GREAT 온보딩 가이드';
  readArmed=false;clearTimeout(readTimer);
  if(pid!=='welcome')readTimer=setTimeout(()=>{readArmed=true;checkRead();},1500);
  closeSidebar();
}
window.addEventListener('popstate',()=>{const h=location.hash.replace('#','');render(P[h]?h:'welcome',false);});
/* ===== 읽음 추적 ===== */
function readSet(){try{return new Set(JSON.parse(localStorage.getItem('gtg_read'))||[]);}catch(e){return new Set();}}
const isRead=pid=>readSet().has(pid);
function readMinutes(pg){return Math.max(1,Math.round(stripHtml(pg.html+' '+(pg.lede||'')).length/450));}
function checkRead(){
  if(!readArmed||!curPid||curPid==='welcome'||isRead(curPid))return;
  const st=window.scrollY||document.documentElement.scrollTop,h=document.documentElement.scrollHeight-window.innerHeight;
  if(h<=40||st/h>=0.85){const s=readSet();s.add(curPid);try{localStorage.setItem('gtg_read',JSON.stringify([...s]));}catch(e){}
    const m=document.getElementById('pmRead');if(m)m.hidden=false;refreshReadUI();}
}
function refreshReadUI(){
  const s=readSet();
  elNav.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('is-read',s.has(a.getAttribute('data-go'))));
  GROUPS.forEach(g=>{const el=elNav.querySelector(`[data-gcnt="${g.id}"]`);if(!el)return;const pages=g.pages.filter(p=>p!=='welcome'),n=pages.filter(p=>s.has(p)).length;el.textContent=`${n}/${pages.length}`;el.classList.toggle('full',n===pages.length);});
}
/* ===== 방문 기록 · 이어서 보기 · 진행률 ===== */
function saveVisit(pid){
  try{
    if(pid!=='welcome')localStorage.setItem('gtg_last',pid);
    let hist=[];try{hist=JSON.parse(localStorage.getItem('gtg_hist'))||[];}catch(e){}
    hist=[pid,...hist.filter(p=>p!==pid&&P[p])].slice(0,8);
    localStorage.setItem('gtg_hist',JSON.stringify(hist));
  }catch(e){}
}
const GDESC={start:"첫날 계정 세팅, 사내 정보, 매일 쓰는 링크",company:"우리가 누구이고 무엇을 하는가 — 전 직원 필독",services:"회사가 파는 상품과 협력마케팅팀이 운영하는 리뷰 체험단",mkt:"마케팅 상품 15종을 하나씩 — 정의·채널·잘 맞는 경우",process:"캠페인 1건이 시작되고 끝나는 흐름과 협업 원칙",ops:"출근부터 퇴근까지, 하루 업무 루틴",kb:"랭킹 로직부터 쿠팡·네이버 리뷰 운영, 가구매 주의까지"};
function checklistState(cl){const items=(P.firstday.html.match(/type="checkbox"/g)||[]).length;let done=0;for(let i=0;i<items;i++)if(localStorage.getItem(clKey(cl,i))==='1')done++;return{done,items};}
function welcomeExtras(){
  const w=document.getElementById('wExtras');if(!w)return;
  const s=readSet(),total=order.length-1,readN=order.filter(p=>p!=='welcome'&&s.has(p)).length,pct=Math.round(readN/total*100);
  let out='';
  const fd=checklistState('firstday');
  if(fd.items&&fd.done<fd.items)out+=`<div class="todo-card" data-go="firstday"><span class="rc-l">먼저 할 일</span><span class="rc-t">입사 첫날 체크리스트</span><span class="rc-a">${fd.done}/${fd.items} →</span></div>`;
  const last=localStorage.getItem('gtg_last');
  if(last&&P[last]&&last!=='firstday')out+=`<div class="resume-card" data-go="${last}"><span class="rc-l">이어서 보기</span><span class="rc-t">${P[last].title}</span><span class="rc-a">계속 →</span></div>`;
  out+=`<div class="prog-wrap"><div class="prog-top"><span class="pg-l">학습 진행률</span><span class="pg-n">${readN}/${total} 페이지 읽음 · ${pct}%</span></div><div class="prog-bar"><i style="width:${pct}%"></i></div></div>`;
  w.innerHTML=out;
  const c=document.getElementById('wCourse');if(!c)return;
  c.innerHTML=GROUPS.map(g=>{const pages=g.pages.filter(p=>p!=='welcome'),n=pages.filter(p=>s.has(p)).length,done=n===pages.length,nextP=pages.find(p=>!s.has(p))||pages[0],gp=Math.round(n/pages.length*100);
    return `<div class="cs ${done?'done':''}" data-go="${nextP}" tabindex="0"><div class="cs-sec">${g.sec}</div><div class="cs-t">${g.title}</div><div class="cs-d">${GDESC[g.id]||''}</div><div class="cs-f"><span>${n}/${pages.length}</span><span class="prog-bar"><i style="width:${gp}%"></i></span><span class="cs-go">${done?'완료 ✓':n?'이어서 →':'시작 →'}</span></div></div>`;}).join('');
}
function scrollActiveNavIntoView(){const a=elNav.querySelector('.nav-link.active');if(!a)return;const at=a.offsetTop,ah=a.offsetHeight,st=elNav.scrollTop,vh=elNav.clientHeight;if(at<st||at+ah>st+vh)elNav.scrollTop=Math.max(0,at-vh/2+ah/2);}
/* ===== 우측 페이지 목차 (이 페이지에서) ===== */
const elToc=document.getElementById('toc');
function buildToc(){
  const heads=[...elContent.querySelectorAll('h2,h3')].filter(h=>h.textContent.trim());
  if(heads.length<2){elToc.innerHTML='';document.body.classList.remove('has-toc');return;}
  heads.forEach((h,i)=>{h.id='sec-'+i;});
  elToc.innerHTML='<div class="toc-h">이 페이지에서</div>'+heads.map(h=>`<a class="toc-link lvl${h.tagName==='H3'?'3':'2'}" data-sec="${h.id}">${h.textContent}</a>`).join('');
  document.body.classList.add('has-toc'); tocSpy();
  const h2s=heads.filter(h=>h.tagName==='H2');
  if(h2s.length>=3){const d=document.createElement('details');d.className='toc-inline';
    d.innerHTML=`<summary>이 페이지 목차 · ${h2s.length}개 섹션</summary><div class="ti">${h2s.map(h=>`<a data-sec="${h.id}">${h.textContent}</a>`).join('')}</div>`;
    const anchor=elContent.querySelector('.page-meta')||elContent.querySelector('.lede');
    if(anchor)anchor.after(d);else elContent.querySelector('h1').after(d);}
}
function scrollToSec(id){const el=document.getElementById(id);if(el){const y=el.getBoundingClientRect().top+window.scrollY-78;window.scrollTo(0,y);requestAnimationFrame(tocSpy);}}
elContent.addEventListener('click',e=>{const a=e.target.closest('[data-sec]');if(!a)return;e.preventDefault();scrollToSec(a.dataset.sec);});
function tocSpy(){const links=[...elToc.querySelectorAll('.toc-link')];if(!links.length)return;let cur=links[0].dataset.sec;for(const l of links){const el=document.getElementById(l.dataset.sec);if(el&&el.getBoundingClientRect().top<=100)cur=l.dataset.sec;}links.forEach(l=>l.classList.toggle('active',l.dataset.sec===cur));}
/* ===== UX: 읽기 진행바 · 맨 위로 · 키보드 ===== */
const readbar=document.getElementById('readbar'),toTop=document.getElementById('toTop');
function onScroll(){const st=window.scrollY||document.documentElement.scrollTop;const h=document.documentElement.scrollHeight-window.innerHeight;readbar.style.width=(h>0?Math.min(100,st/h*100):0)+'%';toTop.classList.toggle('show',st>400);tocSpy();checkRead();}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll,{passive:true});
toTop.addEventListener('click',()=>{window.scrollTo(0,0);});
document.addEventListener('keydown',e=>{
  if(modalBg.classList.contains('open'))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  const cur=location.hash.replace('#',''),i=order.indexOf(P[cur]?cur:'welcome');
  if(e.key==='ArrowLeft'&&i>0){e.preventDefault();render(order[i-1]);}
  else if(e.key==='ArrowRight'&&i<order.length-1){e.preventDefault();render(order[i+1]);}
});
elToc.addEventListener('click',e=>{const a=e.target.closest('[data-sec]');if(a)scrollToSec(a.dataset.sec);});
function hydrateChecklists(){
  document.querySelectorAll('.checklist').forEach(ul=>{
    const cl=ul.getAttribute('data-cl'), lis=[...ul.querySelectorAll('li')];
    const head=document.createElement('div');head.className='cl-head';ul.parentNode.insertBefore(head,ul);
    const upd=()=>{const done=lis.filter(li=>li.classList.contains('checked')).length;head.innerHTML=`✅ 체크포인트 <span class="cl-prog">${done}/${lis.length}${done===lis.length?' · 완료!':''}</span><button class="cl-reset" title="이 체크리스트 초기화">초기화</button>`;
      head.querySelector('.cl-reset').addEventListener('click',()=>{lis.forEach((li,i)=>{const b=li.querySelector('input');b.checked=false;li.classList.remove('checked');localStorage.removeItem(clKey(cl,i));});upd();});};
    lis.forEach((li,i)=>{const box=li.querySelector('input');const saved=localStorage.getItem(clKey(cl,i))==='1';box.checked=saved;li.classList.toggle('checked',saved);
      li.addEventListener('click',e=>{if(e.target!==box)box.checked=!box.checked;li.classList.toggle('checked',box.checked);localStorage.setItem(clKey(cl,i),box.checked?'1':'0');upd();});});
    upd();
  });
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(!a)return;e.preventDefault();if(a.closest('#searchRes'))openResult(a.getAttribute('data-go'));else{render(a.getAttribute('data-go'));closeModal();}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cs[data-go],.card[data-go]')){e.preventDefault();render(e.target.getAttribute('data-go'));}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-toggle]');if(!t)return;t.closest('.nav-group').classList.toggle('collapsed');const open=[...document.querySelectorAll('.nav-group')].filter(n=>!n.classList.contains('collapsed')).map(n=>n.getAttribute('data-group'));localStorage.setItem('gtg_open',JSON.stringify(open));});

/* ===== SEARCH ===== */
const modalBg=document.getElementById('modalBg'),sInput=document.getElementById('searchInput'),sRes=document.getElementById('searchRes');
let selIdx=0,curResults=[],lastQ='';
function findInPage(q){
  if(!q)return;const els=[...elContent.querySelectorAll('h2,h3,p,li,td,.c-t,.c-d,.co-h')];
  const hit=els.find(el=>el.textContent.toLowerCase().includes(q)&&![...el.children].some(c=>els.includes(c)&&c.textContent.toLowerCase().includes(q)));
  if(!hit)return;const y=hit.getBoundingClientRect().top+window.scrollY-window.innerHeight/3;window.scrollTo(0,Math.max(0,y));
  hit.classList.remove('flash');void hit.offsetWidth;hit.classList.add('flash');
}
function openResult(pid){const q=lastQ;closeModal();render(pid);if(q)setTimeout(()=>findInPage(q),30);}
const stripHtml=h=>h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
const INDEX=order.map(pid=>({pid,title:P[pid].title,group:P[pid].group,text:stripHtml(P[pid].html+' '+(P[pid].lede||''))}));
function openModal(){modalBg.classList.add('open');sInput.value='';renderResults('');sInput.focus();}
function closeModal(){modalBg.classList.remove('open');}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=(s,q)=>{s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q);if(i<0)return s;return s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length);};
const sCount=document.getElementById('searchCount');
function renderResults(q){
  q=q.trim().toLowerCase();let list,recCount=0;
  if(!q){
    let hist=[];try{hist=(JSON.parse(localStorage.getItem('gtg_hist'))||[]).filter(p=>P[p]);}catch(e){}
    const rec=hist.map(pid=>INDEX.find(it=>it.pid===pid)).filter(Boolean).slice(0,5);
    recCount=rec.length;
    const rest=INDEX.filter(it=>!hist.includes(it.pid)).slice(0,Math.max(3,8-recCount));
    list=[...rec,...rest];
  }
  else{const terms=q.split(/\s+/).filter(Boolean);
    list=INDEX.map(it=>{const t=it.title.toLowerCase(),g=it.group.toLowerCase(),x=it.text.toLowerCase();let s=0;
      for(const w of terms){let ws=0;if(t.includes(w))ws+=10;if(g.includes(w))ws+=3;if(x.includes(w))ws+=2+Math.min(3,x.split(w).length-2);if(!ws)return{it,s:0};s+=ws;}
      if(terms.length>1&&(t+' '+x).includes(q))s+=6;return{it,s};}).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).map(o=>o.it).slice(0,14);
    q=terms[0]||q;}
  lastQ=q;curResults=list;selIdx=0;
  sCount.textContent=q?`${list.length}${list.length>=14?'+':''}개 결과`:'';
  if(!list.length){sRes.innerHTML=`<div class="m-empty">검색 결과가 없어요</div>`;return;}
  sRes.innerHTML=list.map((it,i)=>{let snip=it.text;if(q){const p=it.text.toLowerCase().indexOf(q);if(p>-1){const st=Math.max(0,p-30);snip=(st>0?'…':'')+it.text.slice(st,st+90)+'…';}}else snip=it.text.slice(0,90)+'…';
    let head='';
    if(!q&&recCount){if(i===0)head='<div class="m-sec">최근 본 페이지</div>';else if(i===recCount)head='<div class="m-sec">둘러보기</div>';}
    return head+`<div class="r ${i===0?'sel':''}" data-go="${it.pid}" data-i="${i}"><div class="r-g">${esc(it.group)}</div><div class="r-t">${hl(it.title,q)}</div><div class="r-c">${hl(snip,q)}</div></div>`;}).join('');
}
sInput.addEventListener('input',()=>renderResults(sInput.value));
document.getElementById('searchBtn').addEventListener('click',openModal);
modalBg.addEventListener('click',e=>{if(e.target===modalBg)closeModal();});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal();}
  if(e.key==='Escape')closeModal();
  if(modalBg.classList.contains('open')&&curResults.length){
    if(e.key==='ArrowDown'){e.preventDefault();selIdx=(selIdx+1)%curResults.length;upSel();}
    if(e.key==='ArrowUp'){e.preventDefault();selIdx=(selIdx-1+curResults.length)%curResults.length;upSel();}
    if(e.key==='Enter'){e.preventDefault();openResult(curResults[selIdx].pid);}
  }
});
function upSel(){const rows=[...sRes.querySelectorAll('.r')];rows.forEach((c,i)=>c.classList.toggle('sel',i===selIdx));const el=rows[selIdx];if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});}
sRes.addEventListener('mousemove',e=>{const r=e.target.closest('.r');if(r&&r.dataset.i!==undefined){const i=+r.dataset.i;if(i!==selIdx){selIdx=i;[...sRes.querySelectorAll('.r')].forEach((c,j)=>c.classList.toggle('sel',j===selIdx));}}});

/* ===== 설정 (테마 · 폰트 · 글자 크기) ===== */
const settingsBtn=document.getElementById('settingsBtn'),settingsPanel=document.getElementById('settingsPanel');
const ZOOMS=[0.9,0.95,1,1.08,1.18];
let theme=localStorage.getItem('gtg_theme'); if(!['light','dark','auto'].includes(theme))theme='auto';
let font=localStorage.getItem('gtg_font')==='serif'?'serif':'sans';
let size=parseInt(localStorage.getItem('gtg_size')); if(isNaN(size)||size<0||size>4)size=2;
const mqDark=matchMedia('(prefers-color-scheme:dark)');
function applyTheme(){const dark=theme==='dark'||(theme==='auto'&&mqDark.matches);if(dark)document.documentElement.setAttribute('data-theme','dark');else document.documentElement.removeAttribute('data-theme');document.querySelectorAll('#segTheme button').forEach(b=>b.classList.toggle('active',b.dataset.themeOpt===theme));}
function applyFont(){if(font==='serif')document.documentElement.setAttribute('data-font','serif');else document.documentElement.removeAttribute('data-font');document.querySelectorAll('#segFont button').forEach(b=>b.classList.toggle('active',b.dataset.fontOpt===font));}
function applySize(){document.documentElement.style.setProperty('--fz-zoom',ZOOMS[size]);const r=document.getElementById('szRange');if(r)r.value=size;}
function applyAll(){applyTheme();applyFont();applySize();}
applyAll();
mqDark.addEventListener('change',()=>{if(theme==='auto')applyTheme();});
settingsBtn.addEventListener('click',e=>{e.stopPropagation();const o=settingsPanel.classList.toggle('open');settingsBtn.classList.toggle('on',o);});
document.addEventListener('click',e=>{if(!e.target.closest('.settings-wrap')){settingsPanel.classList.remove('open');settingsBtn.classList.remove('on');}});
document.getElementById('segTheme').addEventListener('click',e=>{const b=e.target.closest('[data-theme-opt]');if(!b)return;theme=b.dataset.themeOpt;localStorage.setItem('gtg_theme',theme);applyTheme();});
document.getElementById('segFont').addEventListener('click',e=>{const b=e.target.closest('[data-font-opt]');if(!b)return;font=b.dataset.fontOpt;localStorage.setItem('gtg_font',font);applyFont();});
document.getElementById('szRange').addEventListener('input',e=>{size=parseInt(e.target.value);localStorage.setItem('gtg_size',size);applySize();});
document.getElementById('setReset').addEventListener('click',()=>{theme='auto';font='sans';size=2;localStorage.removeItem('gtg_theme');localStorage.removeItem('gtg_font');localStorage.removeItem('gtg_size');applyAll();});
document.getElementById('readReset').addEventListener('click',()=>{if(!confirm('읽음 표시와 학습 진행률을 모두 지울까요?'))return;try{localStorage.removeItem('gtg_read');}catch(e){}render(curPid||'welcome',false);});
if(!/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)){const k=document.querySelector('#searchBtn kbd');if(k)k.textContent='Ctrl K';}

/* ===== MOBILE ===== */
const sidebar=document.getElementById('sidebar'),scrim=document.getElementById('scrim');
function closeSidebar(){sidebar.classList.remove('open');scrim.classList.remove('open');}
document.getElementById('menuToggle').addEventListener('click',()=>{sidebar.classList.toggle('open');scrim.classList.toggle('open');});
scrim.addEventListener('click',closeSidebar);

/* ===== BOOT ===== */
const start=location.hash.replace('#','');
render(P[start]?start:'welcome',false);
</script>
</body>
</html>
